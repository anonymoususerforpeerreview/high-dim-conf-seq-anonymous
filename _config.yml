title: High-Dimensional Confidence Sequences
description: Official website for the paper "On the Tightness and Computational Tractability of Higher-Dimensional Confidence Sequences."
remote_theme: pages-themes/minimal@v0.2.0
plugins:
  - jekyll-remote-theme

show_downloads: false
permalink: /:year/:month/:day/:title/

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax

exclude:
  - .idea/
  - .run/
  - .vscode/
  - __pycache__/
  - adaptive_sample/
  - logs/
  - shared/
  - main.py
  - readme.md
  - requirements.txt
  - run_experiments_async.py
  - ml-comparison-tutorial/
